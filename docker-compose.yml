# Hapi WeChat 微信小程序 - 完整部署
#
# 使用方式:
#   1. cp .env.example .env && 编辑 .env 填写域名
#   2. docker compose up -d
#   3. 获取 token: docker compose logs hapi-hub | grep "CLI_API_TOKEN"
#   4. 小程序填入 https://your-domain.com 作为代理地址
#
# 包含:
#   - hapi-hub (Claude Code 控制中心)
#   - hapi-proxy (SSE→WebSocket 代理)
#   - caddy (自动 HTTPS + WSS 反向代理)
#
# 注意: Hub 的 Dockerfile 需要单独构建
#   cd ../hapi && docker build -t hapi-hub .
#   或者直接用 npm 全局安装方式运行 (见下方注释)

services:
  # 方式一: 如果你有 hapi 的 Docker 镜像
  # hapi-hub:
  #   image: hapi-hub:latest
  #   ...

  # 方式二: 直接用 bun 运行 hapi (推荐简单起见)
  hapi-hub:
    image: oven/bun:1.3
    container_name: hapi-hub
    restart: unless-stopped
    working_dir: /app
    # 把本地 hapi 项目挂载进去
    volumes:
      - ../hapi:/app:ro
      - hapi-data:/root/.hapi
    command: ["bun", "run", "cli/src/index.ts", "hub", "start", "--host", "0.0.0.0", "--port", "3006"]
    environment:
      - HAPI_LISTEN_HOST=0.0.0.0
      - HAPI_LISTEN_PORT=3006
      - HAPI_PUBLIC_URL=${PUBLIC_URL:-https://localhost}

  hapi-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: hapi-proxy
    restart: unless-stopped
    depends_on:
      - hapi-hub
    environment:
      - HAPI_HUB_URL=http://hapi-hub:3006
      - PROXY_PORT=3010

  caddy:
    image: caddy:2-alpine
    container_name: hapi-caddy
    restart: unless-stopped
    depends_on:
      - hapi-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hapi-data:
  caddy-data:
  caddy-config:
